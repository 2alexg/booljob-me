name: Deploy to staging

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/bool/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" api
          docker push "$IMAGE"

      # Add --set-secrets entries here as their Secret Manager values are filled in.
      - name: Deploy API
        run: |
          gcloud run deploy bool-api --quiet \
            --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "bool-api@$PROJECT.iam.gserviceaccount.com" \
            --set-env-vars BOOL_ENVIRONMENT=staging,BOOL_SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --set-secrets BOOL_INTERNAL_SECRET=internal-secret:latest \
            --cpu 1 --memory 512Mi --min-instances 0 --max-instances 3

      - name: Deploy worker
        run: |
          gcloud run deploy bool-worker --quiet \
            --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "bool-worker@$PROJECT.iam.gserviceaccount.com" \
            --set-env-vars BOOL_ENVIRONMENT=staging,APP_FACTORY=bool_api.worker:create_app \
            --cpu 1 --memory 512Mi --min-instances 0 --max-instances 3

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe bool-api --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/v1/me")" = 403
